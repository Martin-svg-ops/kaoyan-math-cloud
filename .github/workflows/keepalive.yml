name: keepalive

# 自动保活：Render 免费实例 15 分钟无请求会休眠，Supabase 免费项目 7 天无 API 请求会暂停。
# 每 2 天定时 ping 一次 Render（拉活实例）和 Supabase（保持项目活跃），确保做题数据与图片随时可用。
on:
  schedule:
    - cron: '0 3 */2 * *'   # 每 2 天 03:00 UTC
  workflow_dispatch:        # 支持手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 拉活 Render 实例
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 150 "https://kaoyan-math-cloud.onrender.com/" || true)
          echo "Render ping: $code"
      - name: 保活 Supabase 项目
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://fmmqbyylbppxrbwutlhk.supabase.co/auth/v1/health" || true)
          echo "Supabase ping: $code"
