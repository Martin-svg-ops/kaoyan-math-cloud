services:
  - type: web
    name: kaoyan-math-cloud
    runtime: node
    plan: free
    region: oregon
    buildCommand: "echo skip-build"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: ADMIN_PASSWORD
        sync: false
