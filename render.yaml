services:
  - type: web
    name: kaoyan-math-cloud
    runtime: node
    plan: free
    region: oregon
    buildCommand: "echo skip-build"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: ADMIN_PASSWORD
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_MODEL
        value: qwen-vl-plus
      - key: GIT_TOKEN
        sync: false
